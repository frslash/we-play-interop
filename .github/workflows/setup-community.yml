name: setup-community
# One-time setup of the room's Railway project (wpi-community): 4 empty services + Redis, 2 volumes, variables, the
# proxy's public domain. Manual run of main only; never on push or pull request. Security's terms: blocks 10727,
# 10742, 10768, 10790. The token is RAILWAY_SETUP_TOKEN, a workspace token that is a secret ONLY of the
# `railway-setup` environment (main only); it is deleted by hand after the first green run, then
# verify-setup-token-dead.yml proves it gets 401. Create-only, idempotent, never deletes, never prints a secret.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: setup-community
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: railway-setup
    steps:
      - name: Fail loudly unless this is a manual run of main with its token
        env:
          HAS_TOKEN: ${{ secrets.RAILWAY_SETUP_TOKEN != '' }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then echo "::error::setup runs only as a manual run of main"; exit 1; fi
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::RAILWAY_SETUP_TOKEN is missing: it must be a secret of the 'railway-setup' environment"; exit 1; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up the project (first call is a read; stops on any permission error)
        env:
          RAILWAY_SETUP_TOKEN: ${{ secrets.RAILWAY_SETUP_TOKEN }}
        run: bash community/setup/setup.sh
