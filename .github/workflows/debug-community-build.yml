name: debug-community-build
# Emrys, 2026-11-09: a throwaway diagnostic on a side branch, never main. Builds the community images
# exactly as Railway does, with the full log kept, so the compile error is visible. No secrets, no deploy.
on:
  push:
    branches: ['debug/emrys-vta-build']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        svc: [vta, vtc, mediator]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: docker build ${{ matrix.svc }} (full log)
        run: docker build --progress=plain "community/${{ matrix.svc }}" 2>&1 | tee build.log; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: Show the errors
        if: failure()
        run: |
          grep -nE 'error(\[E[0-9]+\])?:|-->|could not compile|panicked|failed to run custom build|error: ' build.log | head -80 || true
          echo "---- last 120 lines ----"; tail -n 120 build.log
