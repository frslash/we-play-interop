name: verify-setup-token-dead
# Run AFTER the setup token has been deleted in Railway. Calls the API with the old token and requires 401.
# If it does not get a 401 the run fails: the key is still alive and Faolan is told at once (Security, block 10790).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: railway-setup
    steps:
      - name: The old setup token must be refused
        env:
          RAILWAY_SETUP_TOKEN: ${{ secrets.RAILWAY_SETUP_TOKEN }}
        run: |
          set +x
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::main only"; exit 1; fi
          [ -n "$RAILWAY_SETUP_TOKEN" ] || { echo "::error::the secret is gone from GitHub, so this cannot prove the token is dead in Railway; re-add the old value or check by hand"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer ${RAILWAY_SETUP_TOKEN}" -H 'Content-Type: application/json' --data '{"query":"query { projects { edges { node { id } } } }"}')
          echo "Railway answered HTTP $code"
          if [ "$code" = "401" ]; then echo "OK: the setup token is dead"; else echo "::error::KEY STILL ALIVE (expected 401, got $code): delete the setup token in Railway now"; exit 1; fi
