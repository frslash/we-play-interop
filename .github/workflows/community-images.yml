name: community-images
# Every change to the community host's files must build its images before it can merge (Emrys, 2026-11-09:
# the host's first deploys failed one guessed detail at a time, because Railway's log hides the compiler error).
# Build only: no secrets, no push, no deploy. The full log stays here, and the error lines are shown at the end.
on:
  pull_request:
    paths: ['community/**', '.github/workflows/community-images.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        svc: [vta, vtc, mediator, proxy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: docker build ${{ matrix.svc }}
        shell: bash
        run: docker build --progress=plain "community/${{ matrix.svc }}" 2>&1 | tee build.log; exit "${PIPESTATUS[0]}"
      - name: Show the errors
        if: failure()
        run: |
          grep -nE 'error(\[E[0-9]+\])?:|-->|could not compile|panicked|failed to run custom build|error: ' build.log | head -80 || true
          echo "---- last 120 lines ----"; tail -n 120 build.log
