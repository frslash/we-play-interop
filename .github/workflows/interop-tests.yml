name: interop-tests
# Outside-code tests on GitHub's runners. Read-only by construction:
# no secrets, no environments, no id-token, no push/pull_request_target/workflow_run triggers.
# Edits to this file always go to Faolan as a push card (never the standing merge).
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  did-resolve:
    name: did:webvh resolve (didwebvh-ts 3.1.0) + outside check of inwove.org
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: pinned didwebvh-ts version
        run: node -e "const v=JSON.parse(require('fs').readFileSync('node_modules/didwebvh-ts/package.json','utf8')).version; if(v!=='3.1.0'){console.error('didwebvh-ts is '+v);process.exit(1)}; console.log('didwebvh-ts',v)"
      - name: room DID tests (local mint and resolve)
        run: node --test test/room-did.test.js test/resolver.test.js
      - name: outside check of inwove.org's DID
        run: node sandbox/check-room-did.mjs inwove.org
  vti-build:
    name: OpenVTI c6964c46 build (cargo --locked)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: fetch the pinned source
        run: |
          set -e
          git clone https://github.com/OpenVTC/verifiable-trust-infrastructure vti
          cd vti
          git checkout --detach c6964c46
          full=$(git rev-parse HEAD)
          case "$full" in c6964c46*) echo "pinned at $full" ;; *) echo "wrong commit $full"; exit 1 ;; esac
      - name: system libraries the build needs (libdbus for the keyring crate)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: build and test, locked
        working-directory: vti
        run: |
          cargo build --locked --release
          cargo test --locked --no-run
  room-export:
    name: export inwove.org's public record and re-import it into an empty copy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: export from https://inwove.org (public log only)
        run: node agent/export-log.js https://inwove.org > "$RUNNER_TEMP/room-export.json"
      - name: import into an empty data folder
        run: |
          set -o pipefail
          DATABASE_URL= node agent/import-log.js "$RUNNER_TEMP/room-export.json" "$RUNNER_TEMP/empty-copy" | tee "$RUNNER_TEMP/import.json"
      - name: result (ok, entry count, head seq and hash, unchecked signatures)
        run: |
          node -e '
            const fs = require("fs"), t = process.env.RUNNER_TEMP
            const exp = JSON.parse(fs.readFileSync(t + "/room-export.json", "utf8"))
            const imp = JSON.parse(fs.readFileSync(t + "/import.json", "utf8"))
            const sameCount = imp.entries === exp.count
            const sameHead = imp.head?.seq === exp.head?.seq && imp.head?.hash === exp.head?.hash
            const lines = [
              "ok: " + imp.ok,
              "entries: export " + exp.count + ", import " + imp.entries + (sameCount ? " (same)" : " (DIFFERENT)"),
              "head export: seq " + exp.head?.seq + " " + exp.head?.hash,
              "head import: seq " + imp.head?.seq + " " + imp.head?.hash + (sameHead ? " (same)" : " (DIFFERENT)"),
              "unchecked signatures: " + imp.signaturesNotChecked,
            ]
            console.log(lines.join("\n"))
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Room export check\n\n```\n" + lines.join("\n") + "\n```\n")
            if (!(imp.ok === true && sameCount && sameHead && imp.signaturesNotChecked === 0)) process.exit(1)
          '
