name: export-roundtrip
# The room's export round trip (Goal 2, check 1): export a running room's log, import it into an empty data
# folder, export again from that copy and compare the two entry by entry. The room's record is for its members and
# is no longer public, so this runs against a room the test starts on the runner itself (test/export-roundtrip-ci.test.js
# and test/log-roundtrip.test.js), never against a live one.
# Runs on every pull request and on main, so the latest main run shows whether it passes.
# Read-only: no secrets, no environments, no id-token, no write permission, no pull_request_target.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-roundtrip:
    name: export round trip (a room started here: export, re-import, compare)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: export a room started on this runner, re-import into an empty data folder, export again, compare
        run: node --test test/export-roundtrip-ci.test.js test/log-roundtrip.test.js
