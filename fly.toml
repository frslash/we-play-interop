# Fly.io. Pick your own app name:  fly launch --copy-config --no-deploy --name <your-app>
# Secrets:  fly secrets set WORKSPACE_KEY=… LLM_API_KEY=… GITHUB_TOKEN=… PUBLIC_URL=https://<your-app>.fly.dev
# Storage, one of:
#   a) DATABASE_URL to a managed Postgres (fly secrets set DATABASE_URL=…), and delete [mounts]; or
#   b) embedded Postgres on a Fly volume (encrypted at rest by default): fly volumes create wpi_data --size 1
app = "we-play-interop"
primary_region = "ams"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # the weaver and live updates need a running machine
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[mounts]
  source = "wpi_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
