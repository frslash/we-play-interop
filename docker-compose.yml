# Local or single-box: the workspace and its Postgres.
#   cp .env.example .env   (set WORKSPACE_KEY: npm run keygen)
#   docker compose up --build
# For encryption at rest, keep the pgdata volume on an encrypted disk.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://wpi:wpi@db:5432/wpi
      NODE_ENV: production
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wpi
      POSTGRES_PASSWORD: wpi
      POSTGRES_DB: wpi
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpi -d wpi"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
